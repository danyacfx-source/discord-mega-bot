services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    # .env появляется не во всех способах деплоя (заливка архива генерит его,
    # чистый чекаут из GitHub — нет) — не валяем сборку без него.
    env_file:
      - path: .env
        required: false
    environment:
      # Контейнер должен слушать интерфейс Docker-сети, иначе Traefik
      # не сможет достучаться до веб-панели.
      PANEL_HOST: 0.0.0.0
      OVERLAY_HOST: 0.0.0.0
      # Дефолты на случай, если платформа хостинга не передаёт их через свой env:
      # панель проксирует /overlay с 3000 на этот порт (один порт на домен).
      OVERLAY_PORT: 8765
      OVERLAY_PUBLIC_URL: https://dendich.ru
      # Корень ФС переведён в read_only, а /tmp поднят tmpfs — весь служебный
      # кеш (yt-dlp и ко) уводим туда, иначе запись в $HOME=/app упрётся.
      XDG_CACHE_HOME: /tmp/xdg-cache
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # --- hardening ---
    # Корень ФС только для чтения: бот пишет исключительно в data/ и logs/
    # (bind-mount) и во временный /tmp. Запись в системные каталоги контейнера
    # либо вредоносный код, либо неожиданный сброс кеша — оба варианта
    # запрещены на уровне ФС.
    read_only: true
    tmpfs:
      - /tmp
    # Ставим ровно то, что нужно entrypoint, и больше ничего:
    #   CHOWN    — чинит владельца смонтированных ./data и ./logs от root;
    #   SETUID/SETGID — gosu переводит процесс на непривилегированного bot;
    #   DAC_OVERRIDE — root успевает войти в каталоги, созданные с другими
    #                  правами, пока ownership ещё не исправлен.
    # Всё остальное (NET_RAW, MKNOD, SYS_PTRACE и пр.) контейнеру не нужно.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    # Защита от fork-бомбы и захвата процессов.
    pids_limit: 512
    # Потолок памяти: подушка на Python + ffmpeg при голосовом стриме.
    # OOM-kill перезапустит контейнер, а не уронит хост.
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.megabot.rule=Host(`dendich.ru`) || Host(`www.dendich.ru`)"
      - "traefik.http.routers.megabot.entrypoints=websecure"
      - "traefik.http.routers.megabot.tls=true"
      - "traefik.http.routers.megabot.tls.certresolver=letsencrypt"
      - "traefik.http.services.megabot.loadbalancer.server.port=3000"
      # Оверлей (OBS): тот же домен, путь /overlay → отдельный порт оверлея
      - "traefik.http.routers.megabot-overlay.rule=(Host(`dendich.ru`) || Host(`www.dendich.ru`)) && PathPrefix(`/overlay`)"
      - "traefik.http.routers.megabot-overlay.entrypoints=websecure"
      - "traefik.http.routers.megabot-overlay.tls=true"
      - "traefik.http.routers.megabot-overlay.tls.certresolver=letsencrypt"
      - "traefik.http.routers.megabot-overlay.priority=20"
      - "traefik.http.services.megabot-overlay.loadbalancer.server.port=8765"
    networks:
      - traefik
      - internal

  # Опционально: включается только при миграции на PostgreSQL:
  # docker compose --profile postgres up -d postgres
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-megabot}
      POSTGRES_USER: ${POSTGRES_USER:-megabot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  traefik:
    name: traefik
  internal:
    internal: true

volumes:
  postgres_data:
