services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # Контейнер должен слушать интерфейс Docker-сети, иначе Traefik
      # не сможет достучаться до веб-панели.
      PANEL_HOST: 0.0.0.0
      OVERLAY_HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.megabot.rule=Host(`dendich.link`)"
      - "traefik.http.routers.megabot.entrypoints=websecure"
      - "traefik.http.routers.megabot.tls=true"
      - "traefik.http.routers.megabot.tls.certresolver=letsencrypt"
      - "traefik.http.services.megabot.loadbalancer.server.port=3000"
    networks:
      - traefik
      - internal

  # Опционально: включается только при миграции на PostgreSQL:
  # docker compose --profile postgres up -d postgres
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-megabot}
      POSTGRES_USER: ${POSTGRES_USER:-megabot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  traefik:
    name: traefik
  internal:
    internal: true

volumes:
  postgres_data: