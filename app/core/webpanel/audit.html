<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAVOD · Логи Discord</title>
<style>
:root{--bg:#0d0e12;--panel:#13141a;--panel2:#181a22;--border:#24262f;--text:#e7e9ee;--muted:#8b8f9c;
--accent:#ff3d2e;--ok:#3ddc84;--warn:#f5b942;--err:#ff5f57;--info:#4dd0e1;
--mono:'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,#241a20 0,var(--bg) 60%);color:var(--text);
font-family:'Onest',system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);
background:rgba(13,14,18,.85);position:sticky;top:0;backdrop-filter:blur(8px);z-index:10}
header .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;
place-items:center;font-weight:900;font-size:15px;color:#fff}
header h1{font-size:16px;margin:0}
header .sub{color:var(--muted);font-size:12px;margin-left:2px}
.chip{display:inline-block;margin-left:10px;padding:3px 9px;border-radius:999px;font-size:11px;
background:rgba(255,61,46,.12);border:1px solid rgba(255,61,46,.4);color:#ff8a80}
.navlink{margin-left:auto;color:var(--muted);font-size:12px;text-decoration:none;border:1px solid var(--border);
padding:6px 12px;border-radius:8px}
.navlink:hover{color:var(--accent);border-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;align-items:center}
.toolbar .spacer{flex:1}
select,input[type=text],button{background:var(--panel2);color:var(--text);border:1px solid var(--border);
border-radius:8px;padding:7px 11px;font-size:13px;font-family:inherit}
button{cursor:pointer;transition:.15s}
button:hover{border-color:var(--accent);color:var(--accent)}
#login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
background:rgba(10,11,14,.92)}
.login-card{width:min(340px,92vw);padding:28px 26px;border:1px solid var(--border);border-radius:16px;
background:var(--panel);text-align:center}
.login-card h2{margin:0 0 6px;font-size:19px}
.login-card p{margin:0 0 18px;color:var(--muted);font-size:13px}
.login-card input{width:100%;padding:10px 12px;margin-bottom:14px;font-size:14px;border:1px solid var(--border);
border-radius:9px;background:var(--panel2);color:var(--text)}
.login-card .err{color:var(--err);font-size:12px;min-height:16px;margin-bottom:8px}
.list{padding:0 20px 40px}
.row{display:flex;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;
margin-bottom:7px;background:var(--panel);font-family:var(--mono);font-size:12.5px;line-height:1.45}
.row .t{color:var(--muted);flex-shrink:0;white-space:nowrap}
.row .cat{flex-shrink:0;padding:0 7px;border-radius:6px;font-size:10.5px;line-height:18px;height:18px;
background:var(--panel2);border:1px solid var(--border);text-transform:uppercase;letter-spacing:.4px}
.cat-bot{color:#7986cb;border-color:#3f4a80;background:#1c2033}
.cat-member{color:#4dd0e1;border-color:#1e5a66;background:#122a30}
.cat-message{color:#f5b942;border-color:#6b5420;background:#2a2412}
.cat-voice{color:#ba68c8;border-color:#5d2c6b;background:#251331}
.cat-mod{color:#ef5350;border-color:#70302e;background:#2a1413}
.cat-general{color:#9ccc65;border-color:#4a5e2c;background:#1c2512}
.row .msg{color:var(--text);word-break:break-word;flex:1}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:13px}
footer{color:var(--muted);font-size:11px;padding:0 20px 30px;text-align:center}
.badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:11px;
background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <h2>Вход в логи Discord</h2>
    <p>Панель защищена паролем. Введите его, чтобы просматривать логи.</p>
    <input id="login_pw" type="password" placeholder="Пароль" autocomplete="current-password">
    <div class="err" id="login_err"></div>
    <button id="btn_login" class="active">Войти</button>
  </div>
</div>

<header>
  <div class="logo">Z</div>
  <h1>Логи Discord</h1>
  <span class="sub">события сервера</span>
  <span class="chip" id="count_badge">…</span>
  <a class="navlink" href="/logs">Технические логи →</a>
</header>

<div class="toolbar">
  <select id="f_cat">
    <option value="">Категория: все</option>
    <option value="bot">Бот</option>
    <option value="member">Участники</option>
    <option value="message">Сообщения</option>
    <option value="voice">Голосовые</option>
    <option value="mod">Модерация</option>
    <option value="general">Общее</option>
  </select>
  <label style="color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px">
    <input type="checkbox" id="f_auto" checked> Автообновление
  </label>
  <span class="spacer"></span>
  <span style="color:var(--muted);font-size:12px" id="updated">—</span>
  <button id="btn_pause">Пауза</button>
  <button id="btn_refresh">Обновить</button>
  <button id="btn_logout">Выйти</button>
</div>

<div class="list" id="list"></div>
<footer>Только события Discord: вход/выход участников, удаления/правки сообщений, голосовые, модерация, запуски бота. · /audit</footer>

<script>
let TOKEN = "__PANEL_TOKEN__" || localStorage.getItem("panel-token") || "";
const $ = (id) => document.getElementById(id);

async function api(url, opts) {
  const r = await fetch(url, { ...opts, headers: { "X-Panel-Token": TOKEN } });
  if (r.status === 401) throw new Error("unauthorized");
  return r.json();
}

function showLogin() {
  $("login").style.display = "flex";
  $("login_pw").focus();
}

if (!TOKEN) showLogin();

$("btn_login").onclick = doLogin;
$("login_pw").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  const pw = $("login_pw").value;
  $("login_err").textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw }),
    });
    const d = await r.json();
    if (d && d.token) {
      TOKEN = d.token;
      localStorage.setItem("panel-token", d.token);
      $("login").style.display = "none";
      refresh();
    } else {
      $("login_err").textContent = (d && d.error) || "Неверный пароль";
    }
  } catch (e) {
    $("login_err").textContent = "Ошибка запроса: " + e.message;
  }
}

$("btn_logout").onclick = () => {
  localStorage.removeItem("panel-token");
  TOKEN = "";
  showLogin();
};

const catLabels = { bot: "БОТ", member: "УЧАСТНИК", message: "СООБЩЕНИЕ", voice: "ГОЛОС", mod: "МОДЕРАЦИЯ", general: "ОБЩЕЕ" };

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function refresh() {
  if (!TOKEN) return;
  const cat = encodeURIComponent($("f_cat").value);
  const n = "500";
  try {
    const d = await api(`/api/logs?n=${n}&cat=${cat}&audit=1`);
    const list = $("list");
    $("count_badge").textContent = (d.count ?? 0) + " событий";
    if (!d.logs || !d.logs.length) {
      list.innerHTML = '<div class="empty">Событий Discord по выбранной категории нет.</div>';
    } else {
      list.innerHTML = d.logs.map((e) => {
        const cat = catLabels[e.cat] || esc(e.cat || "");
        return `<div class="row">
          <span class="t">${esc(e.t)}</span>
          <span class="cat cat-${esc(e.cat)}">${cat}</span>
          <span class="msg">${esc(e.msg)}</span>
        </div>`;
      }).join("");
    }
    $("updated").textContent = "обновлено " + new Date().toLocaleTimeString("ru-RU");
  } catch (err) {
    if (err.message === "unauthorized") { showLogin(); return; }
    $("updated").textContent = "ошибка: " + err.message;
  }
}

$("btn_refresh").onclick = refresh;
$("f_cat").onchange = refresh;
let paused = false;
$("btn_pause").onclick = (e) => {
  paused = !paused;
  e.target.textContent = paused ? "Старт" : "Пауза";
  e.target.classList.toggle("active", paused);
  if (!paused) refresh();
};
$("f_auto").onchange = () => { if ($("f_auto").checked) refresh(); };

setInterval(() => {
  if (!paused && $("f_auto").checked) refresh();
}, 4000);

refresh();
</script>
</body>
</html>
