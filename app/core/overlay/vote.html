<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RADIO SILENCE · LIVE VOTE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow:hidden;background:transparent;color:#edf5ed;font:600 17px/1.3 Inter,'Segoe UI',system-ui,sans-serif}
body{padding:12px;display:flex;align-items:flex-start;justify-content:flex-start}
#shell{width:min(100%,720px);padding:24px 27px 22px;border:1px solid #7fa68965;border-radius:18px;background:linear-gradient(132deg,rgba(17,27,22,.94),rgba(7,13,12,.92));box-shadow:0 16px 44px #0009,0 0 24px #59fb9811;position:relative;overflow:hidden;transition:opacity .28s ease,transform .28s ease}
#shell.hidden{opacity:0;transform:translateY(18px);pointer-events:none}
#shell::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 5px,rgba(190,255,206,.017) 6px)}
#eyebrow{font-size:11px;letter-spacing:.26em;font-weight:850;text-transform:uppercase;color:#8be8ab;display:flex;align-items:center;gap:8px}
#dot{width:8px;height:8px;background:#69ff9e;border-radius:100%;box-shadow:0 0 16px #65ffa6;animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
#question{font-size:clamp(20px,4vw,31px);font-weight:850;letter-spacing:-.035em;line-height:1.16;overflow-wrap:anywhere;margin:15px 0 19px}
#choices{display:flex;flex-direction:column;gap:10px}
.choice{display:grid;grid-template-columns:29px minmax(0,1fr) 70px;gap:9px;align-items:center}
.number{display:grid;place-items:center;width:27px;height:27px;border:1px solid #78ba9a88;border-radius:6px;color:#b2ffd0;font-family:Consolas,monospace;font-size:14px}
.main{min-width:0}
.name{display:block;font-size:14px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{height:10px;border-radius:20px;background:#42594b6b;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#57a57b,#b4ffbc);border-radius:20px;box-shadow:0 0 10px #78e6a773;transition:width .65s ease}
.choice.winner .bar{background:linear-gradient(90deg,#f3ab54,#fff199)}
.choice.winner .number{border-color:#ffe492;color:#fff2a7}
.score{font:800 15px/1.2 Consolas,monospace;text-align:right;color:#b2ffd0}
#footer{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #9adbb837;margin-top:18px;padding-top:13px;color:#9cb7a3;font-size:12px;letter-spacing:.08em}
#clock{font-family:Consolas,monospace;color:#c3ffcb}
@media(prefers-reduced-motion:reduce){#dot{animation:none}.bar,#shell{transition:none}}
</style></head>
<body><section id="shell" class="hidden" aria-live="polite">
  <div id="eyebrow"><span id="dot"></span><span id="label">RADIO SILENCE · ЗРИТЕЛИ РЕШАЮТ</span></div>
  <div id="question"></div><div id="choices"></div>
  <div id="footer"><span id="count">0 ГОЛОСОВ · TWITCH + KICK</span><span id="clock"></span></div>
</section>
<script>
const TOKEN="__TOKEN__";
const shell=document.getElementById("shell");
const choices=document.getElementById("choices");
const question=document.getElementById("question");
const count=document.getElementById("count");
const clock=document.getElementById("clock");
const label=document.getElementById("label");
const dot=document.getElementById("dot");
let current=null;
let stamp="";
function fmt(t){return Math.max(0,Math.ceil(t))+" СЕК";}
function draw(){
 if(!current){shell.classList.add("hidden");return;}
 shell.classList.remove("hidden");
 const p=current;
 const next=JSON.stringify([p.question,p.options]);
 if(next!==stamp){
  stamp=next;question.textContent=p.question;choices.replaceChildren();
  p.options.forEach((name,i)=>{
   const row=document.createElement("div");row.className="choice";
   const number=document.createElement("span");number.className="number";number.textContent=String(i+1);
   const main=document.createElement("div");main.className="main";
   const title=document.createElement("span");title.className="name";title.textContent=name;
   const rail=document.createElement("div");rail.className="rail";
   const bar=document.createElement("div");bar.className="bar";
   rail.appendChild(bar);main.append(title,rail);
   const score=document.createElement("span");score.className="score";
   row.append(number,main,score);choices.appendChild(row);
  });
 }
 const ended=p.status!=="active";
 label.textContent=ended?"RADIO SILENCE · РЕЗУЛЬТАТ":"RADIO SILENCE · ЗРИТЕЛИ РЕШАЮТ";
 dot.style.background=ended?"#ffd77a":"#69ff9e";
 Array.from(choices.children).forEach((row,i)=>{
  const n=Number(p.counts[i]||0);
  const percent=p.total?Math.round(n*100/p.total):0;
  row.classList.toggle("winner",ended&&p.leaders.includes(i+1));
  row.querySelector(".bar").style.width=percent+"%";
  row.querySelector(".score").textContent=percent+"%";
 });
 count.textContent=p.total+" ГОЛОСОВ · TWITCH + KICK";
 clock.textContent=ended?"ГОЛОСОВАНИЕ ЗАВЕРШЕНО":"!vote 1 · "+fmt(p.ends_at-Date.now()/1000);
}
async function refresh(){
 try{
  const response=await fetch("/overlay/vote/api",{headers:{"X-Overlay-Token":TOKEN},cache:"no-store"});
  if(!response.ok)return;
  const data=await response.json();
  current=data.poll||null;draw();
 }catch(_){}
}
refresh();setInterval(refresh,2500);setInterval(()=>{if(current)draw()},1000);
</script></body></html>
