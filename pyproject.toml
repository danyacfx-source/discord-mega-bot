[project]
name = "discord-mega-bot"
version = "3.2.0"
description = "Модульный Discord-бот: модерация, музыка, администрирование"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0,<2.6",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.1",
    "yt-dlp>=2024.10.7",
    "PyNaCl>=1.5.0",
    "psutil>=5.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
