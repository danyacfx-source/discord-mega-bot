[project]
name = "discord-mega-bot"
version = "3.4.0"
description = "Модульный Discord-бот: модерация, музыка, администрирование"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0,<2.8",
    "asyncpg>=0.29.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.1",
    "yt-dlp>=2024.10.7",
    "PyNaCl>=1.5.0",
    "psutil>=5.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = [
    "app/types.py",
    "app/features/moderation/cases_repository.py",
    "app/features/reminders/repository.py",
    "app/features/scheduler/repository.py",
    "app/features/giveaways/repository.py",
    "app/core/webpanel/media_files_repository.py",
    "app/features/moderation/cases_service.py",
]
follow_imports = "skip"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true

# discord.py exposes Cog/command metadata through metaclass keyword arguments.
# The available stubs model those classes as object.__init_subclass__, so mypy
# reports false positives for valid declarations such as ``class X(MegaCog,
# name="X")``. Other call-site errors remain enabled.
[[tool.mypy.overrides]]
module = [
    "app.features.*.commands",
    "app.features.*.events",
    "app.features.moderation.automod",
    "app.features.moderation.warns",
    "app.features.monitoring.*",
    "app.features.streams.*",
]
disable_error_code = ["call-arg"]
