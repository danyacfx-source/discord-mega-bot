name: Refresh OBS Chat Frontend Bundle (temporary)
on:
  push:
    branches:
      - fix/restore-obs-chat-overlay-20261025
permissions:
  contents: write
jobs:
  refresh-bundle:
    if: "!contains(github.event.head_commit.message, '[skip chat-dist]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-obs-chat-overlay-20261025
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: panel-ui
      - name: Build frontend
        run: npm run build
        working-directory: panel-ui
      - name: Commit generated frontend only
        run: |
          git add -A app/core/webpanel/dist/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate chat overlay frontend bundle [skip chat-dist]'
            git push origin HEAD:fix/restore-obs-chat-overlay-20261025
          fi
