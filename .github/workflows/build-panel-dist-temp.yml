name: Build panel bundle for OBS mission control

on:
  push:
    branches:
      - feature/radio-silence-overlay-control-20261026
    paths:
      - .github/workflows/build-panel-dist-temp.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - name: Build committed Vite bundle
        working-directory: panel-ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit prebuilt UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/core/webpanel/dist
          if git diff --cached --quiet; then
            echo "No frontend changes"
          else
            git commit -m "build(panel): sync OBS mission control UI"
            git push origin HEAD:refs/heads/feature/radio-silence-overlay-control-20261026
          fi
