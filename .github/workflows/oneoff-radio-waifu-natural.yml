name: RADIO WAIFU Natural Female Voices (one-off)

on:
  push:
    branches:
      - media/radio-waifu-natural-tts-20261027
    paths:
      - .github/workflows/oneoff-radio-waifu-natural.yml
permissions:
  contents: read
jobs:
  create-alert-voices:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free offline TTS runner
        run: python -m pip install --no-input numpy==1.26.4 soundfile onnxruntime==1.23.1 librosa PyYAML huggingface_hub
      - name: Fetch Supertone archived engine source
        run: git clone -q --depth 1 https://github.com/supertone-oss-archive/supertonic.git supertonic-engine
      - name: Generate clean female Russian alert speech from Supertonic 3
        run: python -u tools/oneoff_radio_waifu_supertonic.py
      - name: Check output
        run: |
          test "$(find radio_waifu_new_voice -type f -name '*.mp3' | wc -l)" -eq 6
          ls -lh radio_waifu_new_voice/
      - uses: actions/upload-artifact@v4
        with:
          name: RADIO_WAIFU_NEW_NATURAL_RUSSIAN_VOICES
          path: radio_waifu_new_voice/
          retention-days: 30
          if-no-files-found: error
