name: Build one-off licensed horror audio pack

on:
  push:
    branches:
      - media/oneoff-real-screamer-sfx-20261027
    paths:
      - .github/workflows/oneoff-horror-sfx.yml

permissions:
  contents: read

jobs:
  collect-and-compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio preparation libraries
        run: python -m pip install --no-input numpy requests
      - name: Compose six distinct real-sample horror effects
        run: python oneoff_build_real_sfx.py
      - name: Check output sizes
        run: |
          find out -maxdepth 1 -type f -print
          for f in out/*.mp3; do
            ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$f"
            test "$(stat -c %s "$f")" -lt 8388608
          done
      - uses: actions/upload-artifact@v4
        with:
          name: RADIO_SILENCE_REAL_JUMPSCARE_SOUNDS_6
          path: out/
          if-no-files-found: error
          retention-days: 30
