name: Build OBS chat caption (one-time)

on:
  push:
    branches: [fix/obs-stream-chat-label-20261025]

permissions:
  contents: write

jobs:
  sync-dist:
    if: github.repository == 'danyacfx-source/discord-mega-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --no-audit --no-fund
        working-directory: panel-ui
      - name: Build committed UI assets
        run: npm run build
        working-directory: panel-ui
      - name: Commit built assets and remove one-time builder
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/obs-panel-sync-once.yml
          git add -A -- app/core/webpanel/dist .github/workflows/obs-panel-sync-once.yml
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "build(panel): sync OBS chat caption" 
          git push origin HEAD:fix/obs-stream-chat-label-20261025
