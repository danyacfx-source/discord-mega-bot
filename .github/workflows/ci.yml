name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps (sha256-locked)
        run: pip install --require-hashes -r requirements.lock

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

      - name: pytest
        run: python -m pytest tests -q

  panel-ui:
    name: panel-ui / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web admin (Vite)
        run: npm run build
