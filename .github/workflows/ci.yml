name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps (sha256-locked)
        run: pip install --require-hashes -r requirements.lock

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

      - name: pytest
        run: python -m pytest tests -q

  panel-ui:
    name: panel-ui / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --no-audit --no-fund
      - name: Test private scheduler draft transfer
        run: node --test tests/schedule-draft.test.mjs
      - name: Build web admin (Vite)
        run: npm run build
      - name: Check compiled frontend matches source
        run: |
          if [ -n "$(git -C .. status --porcelain -- app/core/webpanel/dist)" ]; then
            echo 'Prebuilt frontend is out of sync with panel-ui. Run npm run build and commit app/core/webpanel/dist.'
            git -C .. status --short -- app/core/webpanel/dist
            exit 1
          fi
      - name: Install Chromium for visual smoke checks
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile views
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/dendich-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/showcase >/dev/null; then break; fi
            sleep 1
          done
          node tests/branding-smoke.mjs
      - name: Save UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dendich-admin-showcase-previews
          path: panel-ui/artifacts/*.png
          if-no-files-found: ignore



  refresh-publishing-ui-bundle:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/dendich-publishing-flow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - name: Compile committed frontend
        run: |
          cd panel-ui
          npm ci --no-audit --no-fund
          npm run build
      - name: Update frontend dist in feature branch
        env:
          FEATURE_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f app/core/webpanel/dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(panel): sync publishing flow frontend assets"
          git push origin "HEAD:${FEATURE_BRANCH}"
