name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps (sha256-locked)
        run: pip install --require-hashes -r requirements.lock

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

      - name: pytest
        run: python -m pytest tests -q

  panel-ui:
    name: panel-ui / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web admin (Vite)
        run: npm run build
      - name: Install Chromium for visual smoke checks
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile views
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/dendich-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/showcase >/dev/null; then break; fi
            sleep 1
          done
          node tests/branding-smoke.mjs
      - name: Save UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dendich-admin-showcase-previews
          path: panel-ui/artifacts/*.png
          if-no-files-found: ignore

  # One-time maintenance on our own PR branch: repository also distributes prebuilt
  # dist to non-Docker hosts. Sync it so they do not keep serving the anime bundle.
  refresh-ui-dist:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/radio-silence-deployment'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - name: Build frontend into tracked dist
        run: |
          cd panel-ui
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit fresh frontend only if changed
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f app/core/webpanel/dist
          if git diff --cached --quiet; then
            echo "Frontend dist is current"
            exit 0
          fi
          git commit -m "build(panel): sync fresh Radio Silence assets for non-Docker deployment"
          git push origin "HEAD:${PR_BRANCH}"
